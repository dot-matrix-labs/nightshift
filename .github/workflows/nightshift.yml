name: Nightshift

# Triggers when next-prompt.md is updated on main.
# This IS the Nightshift runtime — the commit is the invocation.
on:
  push:
    branches: [main]
    paths:
      - next-prompt.md

# Prevent concurrent runs — one agent session at a time.
concurrency:
  group: nightshift
  cancel-in-progress: false

jobs:
  agent:
    name: Run agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "nightshift[bot]"
          git config user.email "nightshift[bot]@users.noreply.github.com"

      - name: Install agent CLI
        run: |
          # Install Claude Code (adjust if using a different agent)
          npm install -g @anthropic-ai/claude-code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Create worktree branch
        id: branch
        run: |
          BRANCH="ns/session/$(date +%Y%m%d-%H%M%S)"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"

      - name: Run agent on prompt
        run: |
          claude --print < next-prompt.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Prevent the agent from prompting interactively
          CI: true

      - name: Push branch
        run: |
          git push -u origin "${{ steps.branch.outputs.name }}"

      - name: Open PR
        run: |
          PROMPT_TITLE=$(head -3 next-prompt.md | grep -v "^#\|^$" | head -1 | cut -c1-72)
          gh pr create \
            --title "${PROMPT_TITLE:-Nightshift agent session}" \
            --body "$(cat <<'EOF'
Automated PR from Nightshift agent session.

This PR was generated by an AI agent in response to a \`next-prompt.md\` update on \`main\`.

**Prompt:**

$(cat next-prompt.md)
EOF
)" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for PR merge (optional auto-advance)
        if: ${{ vars.NIGHTSHIFT_AUTO_ADVANCE == 'true' }}
        run: |
          echo "Auto-advance enabled — monitoring PR for merge..."
          PR_NUMBER=$(gh pr list --head "${{ steps.branch.outputs.name }}" --json number -q '.[0].number')
          # Poll until merged or 2 hours elapsed
          ELAPSED=0
          while [ $ELAPSED -lt 7200 ]; do
            STATE=$(gh pr view "$PR_NUMBER" --json state,mergedAt -q '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged. Nightshift cycle complete."
              break
            fi
            sleep 60
            ELAPSED=$((ELAPSED + 60))
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
